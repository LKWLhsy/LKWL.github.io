# Global theme parameters

[homepage]
    # Set to true to enable 2-column grid layout
    grid = false

[footer]
    enabled          = true
    since            = 2026
    launchDate       = "2026-08-10"
    runtimeLink      = "stats/"
    showCopyright    = true
    showRuntime      = true
    showCustomText   = true
    showPoweredBy    = true
    showPrivacyLink  = true
    privacyLink      = "privacy/"

[cardImage]
    enabled = true
    default = "img/default-cover.jpg"

[article.footerBox]
    enabled           = true
    showPersonalLabel = true
    icon              = "messages"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled  = true
    provider = "waline"
    
[comments.waline]
    # IMPORTANT: Replace this with your own Waline server URL!
    serverURL    = "https://hugo-comment-umber.vercel.app/"
    pageview     = true
    emoji        = ["https://unpkg.com/@waline/emojis@1.0.1/weibo"]
    requiredMeta = ["name"]

    [comments.waline.locale]
        admin       = "Admin"
        placeholder = ""
